<section class="auth-page py-5">
  <div class="container py-lg-5">
    <div class="auth-card mx-auto p-4 p-md-5">
      <p class="eyebrow text-uppercase fw-semibold mb-2">Welcome back</p>
      <h1 class="h2 fw-bold mb-4">Log in to Flipshot</h1>
      <div class="alert alert-success" role="status" *ngIf="loginSuccess">
        You are logged in successfully.
      </div>
      <div class="alert alert-danger" role="alert" *ngIf="loginError">
        {{ loginError }}
      </div>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <label class="form-label" for="login-email">Email address</label>
        <input
          class="form-control"
          [class.is-invalid]="showError('email')"
          id="login-email"
          type="email"
          placeholder="you@example.com"
          formControlName="email"
        />
        <div class="invalid-feedback d-block mb-3" *ngIf="showError('email')">
          <span *ngIf="loginForm.controls.email.hasError('required')">Email is required.</span>
          <span *ngIf="loginForm.controls.email.hasError('email')">Enter a valid email address.</span>
        </div>

        <label class="form-label" for="login-password">Password</label>
        <input
          class="form-control"
          [class.is-invalid]="showError('password')"
          id="login-password"
          type="password"
          placeholder="Your password"
          formControlName="password"
        />
        <div class="invalid-feedback d-block mb-4" *ngIf="showError('password')">
          Password is required.
        </div>

        <button class="btn btn-primary w-100 rounded-pill" type="submit">Log in</button>
      </form>
      <p class="text-center text-secondary mt-4 mb-0">
        New to Flipshot?
        <a class="fw-semibold text-decoration-none" routerLink="/signup">Create an account</a>
      </p>
    </div>
  </div>
</section>
