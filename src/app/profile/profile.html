<section class="page-section py-5">
  <div class="container py-lg-4">
    <div class="row g-4 align-items-stretch">
      <div class="col-lg-4">
        <div class="profile-card h-100 p-4">
          <div class="profile-avatar mb-4">{{ user.name.charAt(0).toUpperCase() }}</div>
          <p class="eyebrow text-uppercase fw-semibold mb-2">Profile</p>
          <h1 class="h3 fw-bold mb-3">{{ user.name }}</h1>
          <p class="text-secondary mb-0">{{ user.email }}</p>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="profile-card h-100 p-4 p-md-5">
          <p class="eyebrow text-uppercase fw-semibold mb-2">Overview</p>
          <h2 class="display-6 fw-bold mb-4">Your creative snapshot.</h2>

          <div class="row g-3">
            <div class="col-md-4">
              <div class="stat-box h-100 p-4">
                <span class="stat-label">Saved ideas</span>
                <strong class="stat-value">{{ savedCount }}</strong>
              </div>
            </div>
            <div class="col-md-4">
              <div class="stat-box h-100 p-4">
                <span class="stat-label">Collections</span>
                <strong class="stat-value">1</strong>
              </div>
            </div>
            <div class="col-md-4">
              <div class="stat-box h-100 p-4">
                <span class="stat-label">Status</span>
                <strong class="stat-value">Active</strong>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
